name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same versions as rokit.toml. The first run compiles them (several
      # minutes); later runs restore them from the cache. The key names the
      # luau feature so caches of a StyLua built without it aren't reused.
      - name: Restore tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/stylua
            ~/.cargo/bin/selene
            ~/.cargo/bin/lune
            ~/.cargo/bin/rojo
          key: tools-${{ runner.os }}-stylua-2.6.0-luau-selene-0.31.0-lune-0.11.1-rojo-7.7.1

      # StyLua only reads .luau files when built with its luau feature.
      # Without it, `stylua --check` passes while checking nothing.
      - name: Install tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked stylua@2.6.0 --features luau
          cargo install --locked selene@0.31.0 lune@0.11.1 rojo@7.7.1

      # A tidy Luau file must pass and an untidy one must fail, or the check
      # below isn't really looking at the code.
      - name: Make sure StyLua reads Luau
        run: |
          printf 'local count: number = 1\n' > "$RUNNER_TEMP/tidy.luau"
          printf 'local  count: number = 1\n' > "$RUNNER_TEMP/untidy.luau"
          stylua --check "$RUNNER_TEMP/tidy.luau"
          if stylua --check "$RUNNER_TEMP/untidy.luau" > /dev/null; then
            echo "::error::StyLua passed an untidy .luau file, so it is not checking Luau"
            exit 1
          fi

      - name: Check formatting
        run: stylua --check src tests tools

      - name: Lint
        run: selene src

      - name: Test
        run: lune run tests/run

      - name: Build place
        run: rojo build default.project.json -o build.rbxl

      - name: Build showcase place
        run: rojo build showcase.project.json -o showcase.rbxl
